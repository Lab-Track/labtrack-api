spring:
  application:
    name: labtrack
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/labtrack
    username: labtrack
    password: labtrack
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  expiration-ms: 28800000
