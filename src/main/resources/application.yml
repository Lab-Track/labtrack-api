spring:
  application:
    name: labtrack
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/labtrack
    username: labtrack
    password: labtrack
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload-dir: uploads/equipment-photos
  upload-url-prefix: /uploads/equipment-photos
  base-url: ${APP_BASE_URL:http://localhost:8080}

cors:
  # Origens do front permitidas, separadas por vírgula (ex.: CORS_ALLOWED_ORIGINS=https://app.exemplo.com)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  expiration-ms: 28800000
