services:
  postgres:
    image: postgres:16-alpine
    container_name: labtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labtrack
      POSTGRES_USER: labtrack
      POSTGRES_PASSWORD: labtrack
    ports:
      - "5432:5432"
    volumes:
      - labtrack-postgres-data:/var/lib/postgresql/data

volumes:
  labtrack-postgres-data:
